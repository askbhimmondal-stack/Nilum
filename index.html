<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#0d0d0d;color:#eee}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
.page{
  width:min(1065px,92vw);
  height:min(760px,88vh);
  min-height:560px;
  border:7px solid #222;
  outline:1px solid #303030;
  background:#101010;
  display:grid;
  grid-template-columns:44% 56%;
  overflow:hidden;
  position:relative;
}
.login-side{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:70px 72px 45px 95px;
  background:#101010;
}
.brand{
  width:60px;height:60px;
  margin-bottom:62px;
  position:relative;
  align-self:flex-start;
}
.brand:before{
  content:"";
  position:absolute;inset:4px;
  border:5px solid #f5f5f5;border-radius:50%;
}
.brand:after{
  content:"";
  position:absolute;
  width:52px;height:5px;
  background:#f5f5f5;
  transform:rotate(-35deg);
  left:4px;top:28px;
  border-radius:5px;
}
.form{width:100%;max-width:265px}
label{display:block;font-size:12px;margin:0 0 10px;color:#f2f2f2}
.field{
  height:38px;
  width:100%;
  border:1px solid #292929;
  background:#1d1d1d;
  color:#eee;
  padding:0 12px 0 38px;
  font-size:11px;
  outline:none;
  transition:.2s;
}
.field:focus{border-color:#555;background:#202020}
.input-wrap{position:relative;margin-bottom:18px}
.icon{
  position:absolute;left:12px;top:11px;
  width:14px;height:14px;color:#777;
  font-size:13px;line-height:14px
}
button{
  width:100%;height:36px;
  border:1px solid #ddd;
  background:#f4f4f4;color:#111;
  font-size:12px;cursor:pointer;
  margin-top:3px;
}
button:hover{background:#fff}
.signup{
  text-align:center;
  color:#777;font-size:10px;
  margin:15px 0 31px;
}
.signup a{color:#999;text-decoration:underline;cursor:pointer}
.divider{
  display:flex;align-items:center;gap:12px;
  color:#666;font-size:10px;margin-bottom:22px;
}
.divider:before,.divider:after{content:"";height:1px;background:#333;flex:1}
.github{
  background:#050505;color:#eee;
  border:1px solid #222;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.github span{font-size:16px}
.art{
  position:relative;
  background:#101010;
  filter:grayscale(1);
}
.art:after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(90deg,#101010 0%,transparent 15%);
  pointer-events:none;
}
.message{
  position:fixed;bottom:22px;left:50%;
  transform:translateX(-50%);
  padding:9px 15px;background:#191919;border:1px solid #333;
  font-size:11px;color:#aaa;opacity:0;transition:.25s;pointer-events:none
}
.message.show{opacity:1}

.character{
  position:absolute;
  width:min(72%, 570px);
  max-height:88%;
  object-fit:contain;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  transition:opacity .22s ease, transform .22s ease;
  user-select:none;
  -webkit-user-drag:none;
}
.login-status{
  min-height:14px;
  margin-top:9px;
  text-align:center;
  font-size:10px;
  color:#777;
}

/* Mobile / tablet responsive layout */
@media (max-width: 900px){
  .login-side{display:none !important;}
  body{min-height:100dvh;overflow:hidden;padding:0;align-items:center;}
  .page{
    width:100%;max-width:none;height:100dvh;min-height:100dvh;
    border:0;outline:0;display:block;background:#000;
  }
  .art{width:100%;height:100dvh;min-height:100dvh;background:#000;overflow:hidden;}
  .art:after{display:none;}
  .character{
    width:auto;height:88dvh;max-width:90vw;max-height:none;
    left:50%;top:50%;
  }
}

@media (max-width: 600px){
  body{
    padding:10px;
    align-items:flex-start;
  }
  .page{
    width:100%;
    border-width:3px;
    outline:none;
  }
  .art{
    height:185px;
    min-height:185px;
  }
  .character{
    width:52%;
    max-height:96%;
  }
  .login-side{
    padding:30px 20px 34px;
  }
  .brand{
    width:52px;
    height:52px;
    margin-bottom:32px;
  }
  .brand:before{
    border-width:4px;
  }
  .brand:after{
    width:45px;
    height:4px;
    top:24px;
  }
  .form{
    max-width:none;
  }
  label{
    font-size:12px;
    margin-bottom:8px;
  }
  .field{
    height:46px;
    font-size:13px;
    border-radius:2px;
  }
  .icon{
    top:15px;
  }
  .input-wrap{
    margin-bottom:17px;
  }
  button{
    height:46px;
    font-size:13px;
  }
  .signup{
    margin:15px 0 27px;
    font-size:10px;
  }
  .divider{
    margin-bottom:20px;
  }
}

@media (max-width: 380px){
  body{padding:6px}
  .art{
    height:155px;
    min-height:155px;
  }
  .character{
    width:50%;
  }
  .login-side{
    padding:26px 16px 30px;
  }
}
</style>
</head>
<body>
<main class="page">
  <section class="login-side">
    <div class="brand" aria-label="Logo"></div>
    <form class="form" id="loginForm">
      <label for="email">Email</label>
      <div class="input-wrap">
        <span class="icon">✉</span>
        <input class="field" id="email" type="text" placeholder="Admin" autocomplete="email" required>
      </div>

      <label for="password">Password</label>
      <div class="input-wrap">
        <span class="icon">⌕</span>
        <input class="field" id="password" type="password" placeholder="Your password" autocomplete="current-password" required>
      </div>

      <button type="submit">Login</button>
      <div class="login-status" id="loginStatus"></div>

      <div class="signup">Don't have an account? <a href="#" id="signup">Sign up</a></div>

      <div class="divider">or</div>

      <button type="button" class="github" id="github">
        <span>◉</span> Login with Github
      </button>
    </form>
  </section>

  <section class="art" aria-label="Login character">
    <img id="character" class="character" src="normal.png" alt="Character">
  </section>
</main>

<div class="success-video" id="successVideo" aria-hidden="true">
  <video id="vfxVideo" playsinline preload="auto">
    <source src="vfx.mp4" type="video/mp4">
  </video>
</div>

<div class="message" id="message"></div>

<script>
const message = document.getElementById("message");
function show(text){
  message.textContent=text;
  message.classList.add("show");
  clearTimeout(window.msgTimer);
  window.msgTimer=setTimeout(()=>message.classList.remove("show"),2200);
}
const character = document.getElementById("character");
const loginStatus = document.getElementById("loginStatus");
const successVideo = document.getElementById("successVideo");
const vfxVideo = document.getElementById("vfxVideo");

document.getElementById("loginForm").addEventListener("submit", e => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  // Admin credentials
  const validUser = email.toLowerCase() === "admin";
  const validPassword = password === "Admin1";

  if (validUser && validPassword) {
    character.src = "normal.png";
    loginStatus.textContent = "Login successful";
    successVideo.classList.add("show");
    successVideo.setAttribute("aria-hidden", "false");
    vfxVideo.currentTime = 0;
    vfxVideo.play().catch(() => {
      // The login click is a user gesture; if the browser still blocks playback,
      // clicking/tapping the video starts it.
    });
    loginStatus.style.color = "#aaa";
    show("Login successful");
  } else {
    character.src = "evil.png";
    loginStatus.textContent = "Incorrect login details";
    loginStatus.style.color = "#888";
    show("Incorrect email or password");
  }
});

document.getElementById("signup").addEventListener("click", e => {
  e.preventDefault();
  show("Sign up selected");
});

document.getElementById("github").addEventListener("click", () => {
  show("GitHub login selected");
});
</script>
</body>
</html>
